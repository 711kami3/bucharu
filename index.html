<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b7d3e">
<title>鮮度管理</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --green:#0b7d3e; --green-d:#095f30;
    --orange:#e67e00; --red:#d23b34; --gray:#6b7280;
    --bg:#f4f5f7; --card:#ffffff; --line:#e5e7eb; --text:#1f2430;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--text);
    padding-bottom:calc(68px + env(safe-area-inset-bottom));
    -webkit-user-select:none; user-select:none;
  }
  header{
    background:var(--green); color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    font-weight:700; font-size:18px; position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:8px;
  }
  header .sub{font-size:12px; font-weight:400; opacity:.9;}
  header .right{margin-left:auto; display:flex; align-items:center; gap:10px;}
  header #storeBtn{background:rgba(255,255,255,.2); color:#fff; border:none; border-radius:20px; padding:5px 12px; font-size:13px; font-weight:600; cursor:pointer;}
  main{padding:14px; max-width:640px; margin:0 auto;}
  .tab{display:none;}
  .tab.active{display:block;}

  /* 通知バナー */
  #alertBanner{
    display:none; background:#fff4e5; border:1px solid #ffcf8f;
    color:#8a4b00; border-radius:12px; padding:12px 14px; margin-bottom:12px;
    font-size:14px; line-height:1.5;
  }
  #alertBanner.show{display:block;}
  #alertBanner b{color:var(--red);}

  /* カメラ */
  .scanBox{
    background:#000; border-radius:16px; overflow:hidden; position:relative;
    aspect-ratio:3/4; display:flex; align-items:center; justify-content:center;
  }
  .scanBox video{width:100%; height:100%; object-fit:cover;}
  .scanBox .frame{
    position:absolute; inset:18% 12%; border:3px solid rgba(255,255,255,.9);
    border-radius:12px; box-shadow:0 0 0 9999px rgba(0,0,0,.25);
  }
  .scanBox .hint{position:absolute; bottom:12px; color:#fff; font-size:13px; background:rgba(0,0,0,.5); padding:6px 12px; border-radius:20px;}
  .scanBox .placeholder{color:#bbb; font-size:14px; text-align:center; padding:20px;}

  .row{display:flex; gap:10px;}
  .row>*{flex:1;}
  label{font-size:13px; color:var(--gray); display:block; margin:14px 0 6px; font-weight:600;}
  input,select,button,textarea{font-size:16px; font-family:inherit;}
  input,select{
    width:100%; padding:12px; border:1.5px solid var(--line); border-radius:10px;
    background:#fff; color:var(--text);
  }
  input:focus,select:focus{outline:none; border-color:var(--green);}
  .btn{
    border:none; border-radius:10px; padding:13px; font-weight:700; color:#fff;
    background:var(--green); width:100%; cursor:pointer;
  }
  .btn:active{background:var(--green-d);}
  .btn.sec{background:#eef0f3; color:var(--text);}
  .btn.sm{padding:8px 12px; width:auto; font-size:14px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .chip{background:#eef0f3; border:none; border-radius:20px; padding:8px 14px; font-size:14px; cursor:pointer;}
  .chip:active{background:#dde1e6;}
  .chip.on{background:var(--green); color:#fff;}
  .imgrow{display:flex; align-items:center; gap:10px; margin-top:6px;}
  .imgrow img{width:56px; height:56px; object-fit:cover; border-radius:10px; border:1px solid var(--line);}
  .item .thumb{width:44px; height:44px; object-fit:cover; border-radius:8px; flex:0 0 auto; background:#eef0f3; cursor:pointer;}
  #imgModal{align-items:center; justify-content:center; padding:24px;}
  #imgModal img{max-width:100%; max-height:85vh; border-radius:12px; box-shadow:0 8px 40px rgba(0,0,0,.5);}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 4px; font-size:15px;}
  .muted{color:var(--gray); font-size:13px;}

  /* 一覧アイテム */
  .item{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-left-width:6px; border-radius:12px; padding:12px; margin-bottom:10px;}
  .item.ok{border-left-color:var(--green);}
  .item.soon{border-left-color:var(--orange); background:#fffaf2;}
  .item.over{border-left-color:var(--red); background:#fdf1f0;}
  .item .info{flex:1; min-width:0;}
  .item .info .name{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item .info .meta{font-size:13px; color:var(--gray); margin-top:2px;}
  .item .badge{font-size:12px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;}
  .badge.ok{background:#e3f5ea; color:var(--green);}
  .badge.soon{background:#ffe9cc; color:var(--orange);}
  .badge.over{background:#fbdedb; color:var(--red);}
  .item .qty{font-size:14px; font-weight:700; min-width:36px; text-align:right;}
  .iconbtn{background:none; border:none; padding:8px; cursor:pointer; color:var(--gray); border-radius:8px; display:inline-flex; align-items:center;}
  .iconbtn svg{width:20px; height:20px; display:block;}
  .iconbtn.ok{color:var(--green);}
  .iconbtn.danger{color:var(--red);}
  .iconbtn:active{background:#eef0f3;}

  .seg{display:flex; background:#eef0f3; border-radius:10px; padding:4px; margin-bottom:14px;}
  .seg button{flex:1; border:none; background:none; padding:9px 2px; border-radius:8px; font-size:12px; font-weight:600; color:var(--gray); cursor:pointer; white-space:nowrap;}
  .repeatToggle{display:flex; align-items:center; justify-content:space-between; gap:12px; background:#f7f8fa; border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:16px;}
  .rt-title{font-weight:700; font-size:14px;}
  .rt-sub{font-size:12px; color:var(--gray); margin-top:2px;}
  .switch{position:relative; display:inline-block; width:50px; height:30px; flex:0 0 auto;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:#cfd4da; border-radius:30px; transition:.2s;}
  .slider:before{content:""; position:absolute; height:24px; width:24px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
  .switch input:checked + .slider{background:var(--green);}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  .reptag{display:inline-block; margin-left:6px; font-size:11px; font-weight:700; color:var(--green); background:#e3f5ea; border-radius:20px; padding:2px 8px; vertical-align:middle;}
  .seg button.on{background:#fff; color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08);}
  /* 月グループ（開閉） */
  .mgroup{margin-bottom:12px;}
  .mhead{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; font-weight:700; font-size:15px;}
  .mhead .caret{display:inline-flex; color:var(--gray); transition:transform .2s;}
  .mhead .caret svg{width:18px; height:18px; display:block;}
  .mhead.collapsed .caret{transform:rotate(-90deg);}
  .mhead .mcount{margin-left:auto; font-size:13px; color:var(--gray); font-weight:600;}
  .mbody{margin-top:10px;}

  /* カレンダー */
  .calhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .calhead b{font-size:16px;}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal .dow{text-align:center; font-size:12px; color:var(--gray); padding:4px 0;}
  .cal .cell{aspect-ratio:1/1.1; background:#fff; border:1px solid var(--line); border-radius:8px; padding:4px; font-size:13px; position:relative; cursor:pointer;}
  .cal .cell.empty{background:transparent; border:none; cursor:default;}
  .cal .cell.today{border-color:var(--green); border-width:2px;}
  .cal .cell .n{font-weight:600;}
  .cal .cell .dot{position:absolute; bottom:4px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:700; color:#fff; background:var(--orange); border-radius:20px; min-width:18px; text-align:center; padding:1px 4px;}
  .sat{color:#2a6fd6;} .sun{color:#d23b34;}

  nav{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20;}
  nav button{flex:1; border:none; background:none; padding:10px 0 8px; font-size:11px; color:var(--gray); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav button.on{color:var(--green);}
  nav button .ic{font-size:22px;}

  .empty{text-align:center; color:var(--gray); padding:40px 20px; font-size:14px;}

  /* モーダル */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; z-index:40;}
  .modal.show{display:flex;}
  .sheet{background:#fff; width:100%; max-width:640px; margin:0 auto; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:80vh; overflow:auto;}
  .sheet h2{margin:0 0 10px; font-size:17px;}
</style>
</head>
<body>
<header>
  <span>🗓️ 鮮度管理</span>
  <button id="storeBtn" type="button">🏪 未設定</button>
  <span class="right">
    <span class="sub" id="syncDot">●</span>
    <span class="sub" id="clock"></span>
  </span>
</header>

<main>
  <div id="alertBanner"></div>

  <!-- スキャン -->
  <section class="tab active" id="tab-scan">
    <div class="scanBox" id="scanBox">
      <div class="placeholder" id="scanPlaceholder">カメラでバーコードを読み取ります<br>「カメラ開始」を押してください</div>
      <video id="video" playsinline style="display:none"></video>
      <div class="frame" id="frame" style="display:none"></div>
      <div class="hint" id="scanHint" style="display:none">バーコードを枠内に</div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="startCam">📷 カメラ開始</button>
      <button class="btn sec" id="stopCam" style="display:none">停止</button>
    </div>

    <div class="card" id="entryCard" style="margin-top:14px">
      <label>バーコード(JAN)</label>
      <div class="row">
        <input id="jan" inputmode="numeric" placeholder="手入力も可能">
        <button class="btn sec sm" id="lookupBtn" style="flex:0 0 auto">確認</button>
      </div>

      <div class="repeatToggle">
        <div>
          <div class="rt-title">繰り返し商品</div>
          <div class="rt-sub">和菓子・珍味など鮮度が短い商品</div>
        </div>
        <label class="switch"><input type="checkbox" id="repeatChk"><span class="slider"></span></label>
      </div>

      <label>廃棄日（期限）</label>
      <div class="chips" id="quickChips">
        <button class="chip" data-preset="m0">今月末</button>
        <button class="chip" data-preset="m1">来月末</button>
        <button class="chip" data-preset="m2">再来月末</button>
        <button class="chip" data-preset="custom">カスタム</button>
      </div>
      <div style="margin-top:8px">
        <input id="edate" type="date">
      </div>

      <label>商品名</label>
      <input id="pname" placeholder="例） 幕の内弁当">
      <div class="muted" id="masterNote" style="margin-top:4px"></div>

      <label>商品画像（任意）</label>
      <div class="imgrow">
        <img id="imgPreview" alt="" style="display:none">
        <label class="btn sec sm" for="imgInput" style="width:auto">📷 写真を追加</label>
        <button type="button" id="imgClear" class="btn sec sm" style="width:auto; display:none">削除</button>
        <input id="imgInput" type="file" accept="image/*" style="display:none">
      </div>

      <label>個数</label>
      <div class="row" style="align-items:center">
        <button class="btn sec sm" id="qtyMinus" style="flex:0 0 52px">−</button>
        <input id="qty" type="number" value="1" min="1" style="text-align:center">
        <button class="btn sec sm" id="qtyPlus" style="flex:0 0 52px">＋</button>
      </div>

      <button class="btn" id="saveBtn" style="margin-top:16px">✓ 登録する</button>
    </div>
  </section>

  <!-- 一覧 -->
  <section class="tab" id="tab-list">
    <div class="seg" id="listSeg">
      <button class="on" data-f="active">未廃棄</button>
      <button data-f="today">今日廃棄</button>
      <button data-f="tomorrow">明日廃棄</button>
      <button data-f="repeat">繰り返し</button>
      <button data-f="done">廃棄済み</button>
    </div>
    <div id="listArea"></div>
  </section>

  <!-- カレンダー -->
  <section class="tab" id="tab-cal">
    <div class="calhead">
      <button class="btn sec sm" id="prevM">‹</button>
      <b id="calTitle"></b>
      <button class="btn sec sm" id="nextM">›</button>
    </div>
    <div class="cal" id="calGrid"></div>
    <div id="dayDetail" style="margin-top:14px"></div>
  </section>
</main>

<nav>
  <button class="on" data-tab="scan"><span class="ic">📷</span>スキャン</button>
  <button data-tab="list"><span class="ic">📋</span>一覧</button>
  <button data-tab="cal"><span class="ic">🗓️</span>カレンダー</button>
</nav>

<!-- 日別詳細モーダル -->
<div class="modal" id="modal">
  <div class="sheet">
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody"></div>
    <button class="btn sec" id="sheetClose" style="margin-top:12px">閉じる</button>
  </div>
</div>

<!-- 店舗コード設定モーダル -->
<div class="modal" id="storeGate">
  <div class="sheet">
    <h2>店舗コードを設定</h2>
    <p class="muted" style="margin:0 0 12px; line-height:1.6">同じ「店舗コード（合言葉）」を入れた端末どうしで、データが共有されます。店舗ごとに好きな英数字を決めてください。<br>例：<b>kofu-kamiishida</b></p>
    <input id="storeInput" placeholder="例）kofu-kamiishida" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn" id="storeSave" style="margin-top:14px">接続する</button>
    <p class="muted" style="margin-top:10px; font-size:12px">※ 全店舗で同じコードにすると全部が混ざります。店舗ごとに変えてください。</p>
  </div>
</div>

<!-- 画像拡大表示 -->
<div class="modal" id="imgModal">
  <img id="imgModalImg" alt="">
</div>

<!-- 商品編集モーダル -->
<div class="modal" id="editModal">
  <div class="sheet">
    <h2>商品を編集</h2>
    <label>商品名</label>
    <input id="eName" placeholder="例） 幕の内弁当">

    <label>廃棄日（期限）</label>
    <div class="chips" id="eChips">
      <button class="chip" data-preset="m0">今月末</button>
      <button class="chip" data-preset="m1">来月末</button>
      <button class="chip" data-preset="m2">再来月末</button>
      <button class="chip" data-preset="custom">カスタム</button>
    </div>
    <div style="margin-top:8px"><input id="eDate" type="date"></div>

    <label>個数</label>
    <div class="row" style="align-items:center">
      <button class="btn sec sm" id="eQtyMinus" style="flex:0 0 52px">−</button>
      <input id="eQty" type="number" value="1" min="1" style="text-align:center">
      <button class="btn sec sm" id="eQtyPlus" style="flex:0 0 52px">＋</button>
    </div>

    <label>商品画像（任意）</label>
    <div class="imgrow">
      <img id="eImgPreview" alt="" style="display:none">
      <label class="btn sec sm" for="eImgInput" style="width:auto">📷 写真を変更</label>
      <button type="button" id="eImgClear" class="btn sec sm" style="width:auto; display:none">削除</button>
      <input id="eImgInput" type="file" accept="image/*" style="display:none">
    </div>

    <div class="row" style="margin-top:18px">
      <button class="btn sec" id="eCancel">キャンセル</button>
      <button class="btn" id="eSave">保存する</button>
    </div>
  </div>
</div>

<!-- 繰り返し商品：次の廃棄日 -->
<div class="modal" id="nextModal">
  <div class="sheet">
    <h2>次の廃棄日</h2>
    <p class="muted" style="margin:0 0 12px">この繰り返し商品の、次の直近の廃棄日を入力してください。</p>
    <div class="chips" id="nChips">
      <button class="chip" data-d="1">明日</button>
      <button class="chip" data-d="2">明後日</button>
      <button class="chip" data-d="3">3日後</button>
      <button class="chip" data-d="custom">カスタム</button>
    </div>
    <div style="margin-top:8px"><input id="nDate" type="date"></div>
    <div class="row" style="margin-top:18px">
      <button class="btn sec" id="nCancel">キャンセル</button>
      <button class="btn" id="nSave">保存</button>
    </div>
  </div>
</div>

<!-- 確認ダイアログ（iOSアプリ内でも動く自前版） -->
<div class="modal" id="confirmModal">
  <div class="sheet">
    <h2 id="confirmTitle">確認</h2>
    <p class="muted" id="confirmMsg" style="margin:0 0 16px; line-height:1.6"></p>
    <div class="row">
      <button class="btn sec" id="confirmNo">キャンセル</button>
      <button class="btn" id="confirmYes" style="background:var(--red)">削除する</button>
    </div>
  </div>
</div>

<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="vendor/zxing.min.js"></script>
<script>
/* ============ データ層（Firebase 共有DB＋オフライン対応） ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBeCMW9k-B2eV0568A69KS4rNxeXYMCJyY",
  authDomain: "sencho-kanri.firebaseapp.com",
  projectId: "sencho-kanri",
  storageBucket: "sencho-kanri.firebasestorage.app",
  messagingSenderId: "493014371334",
  appId: "1:493014371334:web:4871bea3f31f60bd714787"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.firestore();
fbDb.enablePersistence({synchronizeTabs:true}).catch(()=>{}); // オフラインキャッシュ

let ITEMS = [];   // 同期された商品一覧（メモリ上）
let MASTER = {};  // 同期された商品マスター
let unsubItems=null, unsubMaster=null;

function getStore(){ return localStorage.getItem('fm_store')||''; }
function setStore(c){ localStorage.setItem('fm_store', c); }
function baseRef(){ return fbDb.collection('stores').doc(getStore()); }

// 既存の呼び出しと互換：同期済みメモリを返す
const DB = { items(){ return ITEMS; }, master(){ return MASTER; } };
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SOON_DAYS = 3; // 「まもなく」判定：期限まで3日以内

// 一覧の操作アイコン（シンプルなラインアイコン）
const IC = {
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
  caret:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>'
};

function startSync(){
  stopSync();
  const b = baseRef();
  unsubItems = b.collection('items').onSnapshot(snap=>{
    ITEMS = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    setSyncStatus(snap.metadata.fromCache ? 'offline' : 'online');
    refreshUI();
  }, err=>{ console.warn('items sync', err); setSyncStatus('offline'); });
  unsubMaster = b.collection('master').onSnapshot(snap=>{
    MASTER={}; snap.docs.forEach(d=> MASTER[d.id]=d.data());
  }, err=>{ console.warn('master sync', err); });
}
function stopSync(){
  if(unsubItems){ unsubItems(); unsubItems=null; }
  if(unsubMaster){ unsubMaster(); unsubMaster=null; }
  ITEMS=[]; MASTER={};
}
function refreshUI(){
  const on=document.querySelector('nav button.on');
  const tab=on?on.dataset.tab:'scan';
  if(tab==='list') renderList();
  if(tab==='cal') renderCal();
  checkAlerts();
}
function setSyncStatus(s){

/* ============ 共通ユーティリティ ============ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
function toLocalInput(d){ return {date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, time:`${pad(d.getHours())}:${pad(d.getMinutes())}`}; }
function fmtDT(iso){ const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(iso){ const d=new Date(iso); const w=['日','月','火','水','木','金','土'][d.getDay()]; return `${d.getMonth()+1}/${d.getDate()}(${w})`; }
// 廃棄日 = 期限日（例：期限8/22 → 8/22に廃棄）
function discardDateObj(iso){ const d=new Date(iso); d.setHours(0,0,0,0); return d; }
// 廃棄日と今日の日数差（0=今日廃棄, 1=明日廃棄, -1=昨日で超過）
function discardDiff(iso){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((discardDateObj(iso) - t)/86400000); }
function statusOf(iso){
  const d = discardDiff(iso);
  if(d < 0) return 'over';            // 廃棄日を過ぎた
  if(d <= SOON_DAYS) return 'soon';   // 今日〜数日以内が廃棄日
  return 'ok';
}
function statusLabel(iso){
  const d = discardDiff(iso);
  if(d < 0) return `${-d}日超過`;
  if(d === 0) return '今日廃棄';
  if(d === 1) return '明日廃棄';
  return `あと${d}日`;
}
// 個数（未入力=nullは集計上1として数える）
function qtyOf(i){ return i.qty==null ? 1 : i.qty; }

let notified = new Set();
function checkAlerts(){
  const items = DB.items().filter(i=>!i.discarded);
  const soon = items.filter(i=> statusOf(i.expiry)!=='ok');
  const banner = $('#alertBanner');
  if(soon.length===0){ banner.classList.remove('show'); return; }
  const over = soon.filter(i=>statusOf(i.expiry)==='over');
  const near = soon.filter(i=>statusOf(i.expiry)==='soon');
  let html = '⚠️ ';
  if(over.length) html += `<b>期限超過 ${over.reduce((a,i)=>a+qtyOf(i),0)}点</b> `;
  if(near.length) html += `／ まもなく ${near.reduce((a,i)=>a+qtyOf(i),0)}点`;
  html += `<br><span class="muted">`+ soon.slice(0,3).map(i=>`${i.name}(${statusLabel(i.expiry)})`).join('・') + (soon.length>3?' 他':'') +`</span>`;
  banner.innerHTML = html; banner.classList.add('show');
  // ブラウザ通知（許可時のみ・重複防止）
  if('Notification' in window && Notification.permission==='granted'){
    soon.forEach(i=>{
      const key = i.id + statusOf(i.expiry);
      if(!notified.has(key)){
        notified.add(key);
        new Notification('鮮度管理アラート', {body:`${i.name} ${i.qty}点：${statusLabel(i.expiry)}`});
      }
    });
  }
}

/* ============ カメラ / バーコード ============ */
let stream=null, scanning=false, detector=null, zxTimer=null;
if('BarcodeDetector' in window){
  detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','codabar','itf']});
}
// iPhone等（ZXing）用：多形式リーダー＋「向き自由」の自前ループ
let mfReader=null, zxHints=null;
if(window.ZXing){
  zxHints=new Map();
  zxHints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);
  zxHints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  mfReader=new ZXing.MultiFormatReader(); mfReader.setHints(zxHints);
}
const _zc=document.createElement('canvas'), _zr=document.createElement('canvas');
function zxDecode(cv){
  try{ const s=new ZXing.HTMLCanvasElementLuminanceSource(cv); const b=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(s)); const r=mfReader.decode(b, zxHints); return r?r.getText():null; }
  catch(e){ return null; } finally{ try{ mfReader.reset(); }catch(e){} }
}
function drawRot90(src,w,h){ _zr.width=h; _zr.height=w; const c=_zr.getContext('2d'); c.translate(h/2,w/2); c.rotate(Math.PI/2); c.drawImage(src,-w/2,-h/2,w,h); return _zr; }
function zxLoop(){
  if(!scanning || !mfReader) return;
  const v=$('#video');
  if(v.videoWidth){
    let w=v.videoWidth, h=v.videoHeight, dw=w, dh=h; const maxW=1080;
    if(w>maxW){ dh=Math.round(h*maxW/w); dw=maxW; }
    _zc.width=dw; _zc.height=dh; _zc.getContext('2d').drawImage(v,0,0,dw,dh);
    let code=zxDecode(_zc);
    if(!code) code=zxDecode(drawRot90(_zc,dw,dh)); // 向きが違えば90°回して再挑戦
    if(code){ const now=Date.now(); if(code!==lastCode||now-lastTime>2500){ lastCode=code; lastTime=now; onScanned(code); return; } }
  }
  zxTimer=setTimeout(()=>{ if(scanning) requestAnimationFrame(zxLoop); }, 110);
}
$('#startCam').onclick = startCam;
$('#stopCam').onclick = stopCam;
async function startCam(){
  const v=$('#video');
  const showUI=()=>{ v.style.display='block'; $('#frame').style.display='block'; $('#scanHint').style.display='block';
    $('#scanPlaceholder').style.display='none'; $('#startCam').style.display='none'; $('#stopCam').style.display='block'; };
  try{
    if(detector){
      // Android Chrome 等：ブラウザ標準APIで読取（高速）
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      v.srcObject=stream; await v.play(); showUI();
      scanning=true; loopDetect();
    } else if(mfReader){
      // iPhone Safari 等：向き自由の自前ループで読取（縦横どちらでもOK）
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}}});
      v.srcObject=stream; v.muted=true; v.setAttribute('playsinline',''); await v.play();
      showUI(); scanning=true;
      $('#scanHint').textContent='バーコードを枠内へ（向きは自由）';
      zxLoop();
    } else {
      // 読取エンジンが無い端末：番号手入力で運用
      showUI();
      $('#scanHint').textContent='この端末は自動読取に非対応。番号は手入力してください';
    }
    if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
  }catch(e){ showToast('カメラを起動できませんでした。\nHTTPS環境か、カメラ権限をご確認ください。\n（番号の手入力でも登録できます）'); }
}
function stopCam(){
  scanning=false;
  if(zxTimer){ clearTimeout(zxTimer); zxTimer=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  const v=$('#video'); v.style.display='none'; $('#frame').style.display='none'; $('#scanHint').style.display='none';
  $('#scanPlaceholder').style.display='block';
  $('#startCam').style.display='block'; $('#stopCam').style.display='none';
}
let lastCode='', lastTime=0;
async function loopDetect(){
  if(!scanning) return;
  try{
    const codes = await detector.detect($('#video'));
    if(codes.length){
      const val = codes[0].rawValue;
      const now = Date.now();
      if(val && (val!==lastCode || now-lastTime>2500)){
        lastCode=val; lastTime=now;
        onScanned(val);
      }
    }
  }catch(e){}
  requestAnimationFrame(loopDetect);
}
function onScanned(code){
  if(navigator.vibrate) navigator.vibrate(60);
  $('#jan').value = code;
  lookup(code);
  stopCam(); // 電池節約：読み取れたら自動でカメラを停止
  showToast('読み取りました：'+code);
}

let currentImg = ''; // 登録予定の画像（data URL）／未設定は空
function showImgPreview(){
  const img=$('#imgPreview'), clr=$('#imgClear');
  if(currentImg){ img.src=currentImg; img.style.display='block'; clr.style.display='inline-block'; }
  else { img.removeAttribute('src'); img.style.display='none'; clr.style.display='none'; }
}
// 端末負荷とDB容量のため、最大400pxのJPEGに縮小
function resizeImage(file, maxSize, quality){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.width, h=img.height;
      if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } }
      else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror=rej;
    img.src=url;
  });
}
$('#imgInput').onchange = e=>{
  const f = e.target.files && e.target.files[0];
  if(!f){ return; }
  resizeImage(f, 400, 0.6)
    .then(d=>{ currentImg=d; showImgPreview(); })
    .catch(()=> showToast('画像を読み込めませんでした'));
  e.target.value=''; // 同じ写真を選び直せるように
};

$('#saveBtn').onclick = ()=>{
  const jan = $('#jan').value.trim();
  const name = $('#pname').value.trim();
  const date = $('#edate').value;
  const qtyRaw = $('#qty').value.trim();
  const qty = qtyRaw==='' ? null : Math.max(1, +qtyRaw||1); // 空欄OK（繰り返し商品など）
  const repeat = $('#repeatChk').checked;
  if(!getStore()){ openStoreGate(); return; }
  if(!name){ showToast('商品名を入力してください'); return; }
  if(!date){ showToast('廃棄日を選んでください'); return; }
  // 日付管理。正午で保存し、日付のズレ（タイムゾーン）を防ぐ
  const expiry = new Date(`${date}T12:00:00`).toISOString();
  const img = currentImg || '';
  const id = uid();
  const b = baseRef();
  // アイテム追加（共有DBへ。オフライン時は自動でキュー→復帰時に同期）
  b.collection('items').doc(id).set({jan, name, expiry, qty, img, repeat, createdAt:new Date().toISOString(), discarded:false});
  // マスター更新（次回から自動表示。merge で既存の画像/名前を消さない）
  if(jan) b.collection('master').doc(jan).set(img?{name, img}:{name}, {merge:true});
  // リセット
  $('#pname').value=''; $('#jan').value=''; $('#qty').value=1; $('#masterNote').textContent='';
  $('#repeatChk').checked=false;
  currentImg=''; showImgPreview();
  $('#scanHint').textContent='バーコードを枠内に';
  if(navigator.vibrate) navigator.vibrate([40,40,40]);
  showToast(`登録しました：${name}${qty!=null?` ${qty}点`:''}`);
};
function showToast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25)';
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

function itemHTML(i){
  const st = i.discarded?'ok':statusOf(i.expiry);
  return `<div class="item ${i.discarded?'':st}">
      ${i.img?`<img class="thumb" src="${i.img}" alt="">`:''}
      <div class="info">
        <div class="name">${esc(i.name)}</div>
        <div class="meta">期限 ${fmtDate(i.expiry)} ・ <span class="badge ${st}">${i.discarded?'廃棄済み':statusLabel(i.expiry)}</span>${i.repeat?'<span class="reptag">繰り返し</span>':''}</div>
      </div>
      <div class="qty">${i.qty!=null?`${i.qty}点`:'—'}</div>
      <button class="iconbtn" onclick="editItem('${i.id}')" title="編集" aria-label="編集">${IC.edit}</button>
      ${i.discarded
        ? `<button class="iconbtn" onclick="undiscard('${i.id}')" title="戻す" aria-label="戻す">${IC.undo}</button>`
        : `<button class="iconbtn ok" onclick="discard('${i.id}')" title="廃棄した" aria-label="廃棄した">${IC.check}</button>`}
      <button class="iconbtn danger" onclick="delItem('${i.id}')" title="削除" aria-label="削除">${IC.trash}</button>
    </div>`;
}
function renderList(){
  let items = DB.items();
  const area=$('#listArea');
  if(listFilter==='active') items=items.filter(i=>!i.discarded);
  else if(listFilter==='done') items=items.filter(i=>i.discarded);
  else if(listFilter==='today'){
    items=items.filter(i=>!i.discarded && discardDiff(i.expiry)===0);
  }
  else if(listFilter==='tomorrow'){
    items=items.filter(i=>!i.discarded && discardDiff(i.expiry)===1);
  }
  else if(listFilter==='repeat'){
    items=items.filter(i=>i.repeat && !i.discarded);
  }
  items.sort((a,b)=> new Date(a.expiry)-new Date(b.expiry));
  if(items.length===0){ area.innerHTML='<div class="empty">該当する商品はありません</div>'; return; }
  // 月ごとにグループ化（廃棄日=期限日の年月で）
  const groups=[], idx={}, thisYear=new Date().getFullYear();
  items.forEach(i=>{
    const d=new Date(i.expiry), key=`${d.getFullYear()}-${d.getMonth()}`;
    if(idx[key]===undefined){ idx[key]=groups.length; groups.push({key, y:d.getFullYear(), m:d.getMonth(), items:[], sum:0}); }
    const g=groups[idx[key]]; g.items.push(i); g.sum+=qtyOf(i);
  });
  area.innerHTML = groups.map(g=>{
    const collapsed = collapsedMonths.has(g.key);
    const label = `${g.y===thisYear?'':g.y+'年'}${g.m+1}月`;
    return `<div class="mgroup">
      <div class="mhead ${collapsed?'collapsed':''}" onclick="toggleMonth('${g.key}')">
        <span class="caret">${IC.caret}</span>
        <span>${label}</span>
        <span class="mcount">${g.items.length}件 / ${g.sum}点</span>
      </div>
      ${collapsed?'':`<div class="mbody">${g.items.map(itemHTML).join('')}</div>`}
    </div>`;
  }).join('');
}
window.toggleMonth=key=>{ if(collapsedMonths.has(key)) collapsedMonths.delete(key); else collapsedMonths.add(key); renderList(); };
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
window.discard=id=>{

};
window.undiscard=id=>{ baseRef().collection('items').doc(id).update({discarded:false}); };

$('#eSave').onclick=()=>{
  if(!editingId) return;
  const name=$('#eName').value.trim(), date=$('#eDate').value;
  const eQtyRaw=$('#eQty').value.trim(); const qty = eQtyRaw==='' ? null : Math.max(1,+eQtyRaw||1);
  if(!name){ showToast('商品名を入力してください'); return; }
  if(!date){ showToast('廃棄日を選んでください'); return; }
  const expiry=new Date(`${date}T12:00:00`).toISOString();
  const it=ITEMS.find(i=>i.id===editingId);
  const b=baseRef();
  b.collection('items').doc(editingId).update({name, expiry, qty, img:editImg});
  if(it && it.jan) b.collection('master').doc(it.jan).set(editImg?{name, img:editImg}:{name}, {merge:true});
  $('#editModal').classList.remove('show'); editingId=null;
  showToast('更新しました');
};

/* ============ 繰り返し商品：次の廃棄日を入力 ============ */
let nextId=null;
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d; }
function openNextDate(id){
  nextId=id;
  $('#nDate').value=toLocalInput(addDays(1)).date;
  document.querySelectorAll('#nChips .chip').forEach(c=>c.classList.remove('on'));
  $('#nextModal').classList.add('show');
}
document.querySelectorAll('#nChips .chip').forEach(c=>{
  c.onclick=()=>{
    const p=c.dataset.d;
    document.querySelectorAll('#nChips .chip').forEach(x=>x.classList.remove('on'));
    if(p==='custom'){ c.classList.add('on'); const el=$('#nDate'); el.focus(); if(el.showPicker){ try{ el.showPicker(); }catch(e){} } return; }
    $('#nDate').value=toLocalInput(addDays(+p)).date; c.classList.add('on');
  };
});
$('#nCancel').onclick=()=>{ $('#nextModal').classList.remove('show'); nextId=null; };
$('#nextModal').onclick=e=>{ if(e.target.id==='nextModal'){ $('#nextModal').classList.remove('show'); nextId=null; } };
$('#nSave').onclick=()=>{
  if(!nextId) return;
  const date=$('#nDate').value; if(!date){ showToast('日付を選んでください'); return; }
  const expiry=new Date(`${date}T12:00:00`).toISOString();
  baseRef().collection('items').doc(nextId).update({expiry});
  $('#nextModal').classList.remove('show'); nextId=null;
  showToast('次の廃棄日を更新しました');
};

/* ============ カレンダー ============ */
let calY, calM; // 表示中の年月
(function(){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); })();
$('#prevM').onclick=()=>{ calM--; if(calM<0){calM=11;calY--;} renderCal(); };
$('#nextM').onclick=()=>{ calM++; if(calM>11){calM=0;calY++;} renderCal(); };
function renderCal(){
  $('#calTitle').textContent = `${calY}年 ${calM+1}月`;
  const first=new Date(calY,calM,1); const startDow=first.getDay();
  const days=new Date(calY,calM+1,0).getDate();
  const items=DB.items().filter(i=>!i.discarded);
  const byDay={};
  items.forEach(i=>{ const d=discardDateObj(i.expiry); if(d.getFullYear()===calY&&d.getMonth()===calM){ const k=d.getDate(); byDay[k]=(byDay[k]||0)+qtyOf(i); } });
  const today=new Date();
  const dows=['日','月','火','水','木','金','土'];
  let html = dows.map((d,i)=>`<div class="dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('');
  for(let i=0;i<startDow;i++) html+='<div class="cell empty"></div>';
  for(let d=1;d<=days;d++){
    const dow=new Date(calY,calM,d).getDay();
    const isToday = today.getFullYear()===calY&&today.getMonth()===calM&&today.getDate()===d;
    const cnt=byDay[d];
    html+=`<div class="cell ${isToday?'today':''}" onclick="showDay(${d})">
      <span class="n ${dow===0?'sun':dow===6?'sat':''}">${d}</span>
      ${cnt?`<span class="dot">${cnt}</span>`:''}
    </div>`;
  }
  $('#calGrid').innerHTML=html;
  $('#dayDetail').innerHTML='';
}
window.showDay=d=>{
  const items=DB.items().filter(i=>{ if(i.discarded) return false; const dd=discardDateObj(i.expiry); return dd.getFullYear()===calY && dd.getMonth()===calM && dd.getDate()===d; }).sort((a,b)=>new Date(a.expiry)-new Date(b.expiry));
  $('#sheetTitle').textContent=`${calM+1}月${d}日 の廃棄予定（${items.reduce((a,i)=>a+qtyOf(i),0)}点）`;
  $('#sheetBody').innerHTML = items.length? items.map(i=>`
    <div class="item ${statusOf(i.expiry)}">
      ${i.img?`<img class="thumb" src="${i.img}" alt="">`:''}
      <div class="info"><div class="name">${esc(i.name)}</div><div class="meta">期限 ${fmtDate(i.expiry)}${i.repeat?'<span class="reptag">繰り返し</span>':''}</div></div>
      <div class="qty">${i.qty!=null?`${i.qty}点`:'—'}</div>
    </div>`).join('') : '<div class="empty">予定はありません</div>';
  $('#modal').classList.add('show');
};
$('#sheetClose').onclick=()=>$('#modal').classList.remove('show');
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.remove('show'); };

/* ============ 起動時 ============ */
(function init(){
  const t=toLocalInput(new Date());
  $('#edate').value=t.date;
  updateStoreLabel();
  // 店舗コード設定
  $('#storeBtn').onclick=()=>openStoreGate();
  $('#storeSave').onclick=()=>{
    let code=$('#storeInput').value.trim().toLowerCase().replace(/[^a-z0-9_\-]/g,'');
    if(code.length<3){ showToast('3文字以上の英数字で入力してください（例：kofu-kamiishida）'); return; }
    setStore(code); updateStoreLabel();
    $('#storeGate').classList.remove('show');
    if(fbAuth.currentUser) startSync();
  };
  $('#storeInput').onkeydown=e=>{ if(e.key==='Enter') $('#storeSave').click(); };
  // 店舗コード未設定の初回はモーダルを閉じさせない
  $('#storeGate').onclick=e=>{ if(e.target.id==='storeGate' && getStore()) $('#storeGate').classList.remove('show'); };
  // Firebase 匿名ログイン → 同期開始
  fbAuth.signInAnonymously().catch(e=>{ console.warn('auth', e); setSyncStatus('offline'); });
  fbAuth.onAuthStateChanged(user=>{
    if(user){ if(getStore()) startSync(); else openStoreGate(); }
  });
  checkAlerts();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
